function fmtDueDate(ds){if(!ds)return null;const[,m,d]=ds.split("-");return`${MONTHS_SHORT[parseInt(m)-1]} ${parseInt(d)}`;}
function DueBadge({dueDate,calculatedDate}){
  if(!dueDate)return null;
  const today=todayDS();
  const overdue=dueDate<today,dueToday=dueDate===today;
  let bg,color,border;
  if(overdue){bg="#fde8e7";color=C.pa;border=C.pa;}
  else if(dueToday){bg="#fef3e2";color=C.pb;border=C.pb;}
  else{bg=C.bg2;color=C.text3;border=C.border;}

}

const STALE_DAYS={A:7,B:10};
function isStale(task){
  if(task.doneDate||task.waiting||task.inProgress)return false;
  if(!STALE_DAYS[task.priority])return false;
  if(task.dueDate)return false; // has a scheduled date, not stale
  if(task.snoozedUntil&&task.snoozedUntil>todayDS())return false;
  const added=task.addedDate||"";if(!added)return false;
  const ref=task.snoozedUntil||added; // snooze resets the clock
  const diff=(new Date(todayDS())-new Date(ref))/(1000*60*60*24);
  return diff>=STALE_DAYS[task.priority];
}

function nextDueDate(recur){
  const d=new Date();
  if(!recur)return toDS(d.getFullYear(),d.getMonth(),d.getDate());
  if(recur.startsWith("custom:")){
    const[,n,unit]=recur.split(":");
    if(unit==="manual")return toDS(d.getFullYear(),d.getMonth(),d.getDate()); // user sets manually
    const num=parseInt(n)||1;
    if(unit==="days")d.setDate(d.getDate()+num);
    else if(unit==="weeks")d.setDate(d.getDate()+num*7);
    else if(unit==="months")d.setMonth(d.getMonth()+num);
    else if(unit==="years")d.setFullYear(d.getFullYear()+num);
  } else if(recur==="daily")d.setDate(d.getDate()+1);
  else if(recur==="weekly")d.setDate(d.getDate()+7);
  else if(recur==="biweekly")d.setDate(d.getDate()+14);
  else if(recur==="monthly")d.setMonth(d.getMonth()+1);
  return toDS(d.getFullYear(),d.getMonth(),d.getDate());
}

async function askCoach(messages,ctx=""){
  const sys=COACH_SYS+(ctx?"\n\nUser data:\n"+ctx:"");
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),30000);
  let res;
  const apiKey=getApiKey();
  const headers={"content-type":"application/json","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
  if(apiKey){headers["x-api-key"]=apiKey;}
  try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:controller.signal,headers,body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,stream:false,system:sys,messages:messages.slice(-12)})});}
  catch(e){clearTimeout(timeout);if(e.name==="AbortError")throw new Error("Coach timed out — try again.");throw new Error("Network error: "+e.message);}
  clearTimeout(timeout);
  if(!res.ok){if(res.status===429)throw new Error("Rate limit — wait a moment.");if(res.status===401)throw new Error("API key invalid — check Settings.");throw new Error("HTTP "+res.status);}
  const data=await res.json();
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").replace(/^[,\s]+/,"");
  if(!text)throw new Error("No response — try again.");
  return text;
}

  const doSearch=q=>{setSearch(q);if(!q.trim()){setSearchResults([]);return;}const ql=q.toLowerCase();const results=tasks.filter(t=>t.doneDate&&t.title.toLowerCase().includes(ql)).map(t=>({id:t.id,title:t.title,date:t.completedOn||t.doneDate,doneDate:t.doneDate,trivial:t.trivial})).filter(r=>r.date&&r.date!=="trivial").sort((a,b)=>b.date.localeCompare(a.date));setSearchResults(results);};
  const jumpTo=dateStr=>{const[y,m]=dateStr.split("-");setCal({y:parseInt(y),m:parseInt(m)-1});setSearch("");setSearchResults([]);onDayClick(dateStr);};
  const nav=d=>setCal(c=>{let m=c.m+d,y=c.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}return{y,m};});
  const firstDay=new Date(cal.y,cal.m,1).getDay();const dim=new Date(cal.y,cal.m+1,0).getDate();const todS=todayDS();
  let great=0,good=0,okay=0,hard=0;
  for(let d=1;d<=dim;d++){const e=moodData[toDS(cal.y,cal.m,d)];if(e){if(e.mood==="great")great++;else if(e.mood==="good")good++;else if(e.mood==="okay")okay++;else hard++;}}
  const mCol={great:{bg:C.mgr2,border:C.mgr},good:{bg:C.mg2,border:C.mg},okay:{bg:C.mo2,border:C.mo},hard:{bg:C.mh2,border:C.mh}};

          <span style={{fontSize:".84rem",color:C.text}}>{r.trivial&&"🧹 "}{r.title}</span>
          <span style={{fontSize:".76rem",color:C.text3,flexShrink:0,marginLeft:8}}>{label}</span>
        </div>);})}
      </div>}
      {search&&searchResults.length===0&&<div style={{marginTop:4,fontSize:".78rem",color:C.text3,padding:"4px 2px"}}>No completed tasks found.</div>}
    </div>

      <button style={S.btnIcon} onClick={()=>nav(-1)}>‹</button>
      <div style={{fontFamily:"Georgia,serif",fontSize:"1rem",fontWeight:600}}>{MONTHS[cal.m]} {cal.y}</div>
      <button style={S.btnIcon} onClick={()=>nav(1)}>›</button>
    </div>
    <div style={S.calGrid}>
      {DOWS.map(d=><div key={d} style={{textAlign:"center",fontSize:".7rem",fontWeight:600,color:C.text3,padding:"4px 0",textTransform:"uppercase"}}>{d}</div>)}
      {Array(firstDay).fill(null).map((_,i)=><div key={"e"+i}/>)}
      {Array(dim).fill(null).map((_,i)=>{
        const d=i+1,key=toDS(cal.y,cal.m,d),ent=moodData[key],dot=tasks.filter(t=>t.doneDate===key||t.completedOn===key).length,hasLog=(coachLogs[key]||[]).length>0;
        const col=ent?mCol[ent.mood]:null;
        return <div key={d} onClick={()=>onDayClick(key)} style={{borderRadius:6,border:`1px solid ${col?col.border:C.border}`,background:col?col.bg:C.bg2,cursor:"pointer",position:"relative",minHeight:52,transition:"all .15s"}}>
          <div style={{fontSize:".73rem",padding:"3px 5px",fontWeight:key===todS?700:400,color:key===todS?C.accent:C.text}}>{d}</div>
          {ent&&<div style={{fontSize:".95rem",padding:"1px 0 0 4px"}}>{mEm[ent.mood]}</div>}
          {dot>0&&<div style={{position:"absolute",bottom:2,right:3,fontSize:".58rem",color:C.text3,fontWeight:700}}>✓{dot}</div>}
          {hasLog&&<div style={{position:"absolute",top:2,right:3,fontSize:".65rem"}}>💬</div>}
        </div>;
      })}
    </div>

      {[["😊 Great",great,C.mgr2,"#2d6b2d"],["🙂 Good",good,C.mg2,"#2d6b2d"],["😐 OK",okay,C.mo2,"#6a5010"],["😩 Ugh",hard,C.mh2,"#803028"]].map(([label,count,bg,color])=>(
        <div key={label} style={{padding:"4px 11px",borderRadius:20,background:bg,color,fontSize:".79rem",fontWeight:500}}>{label}: {count}</div>
      ))}
    </div>
  </div>);
}

function CoachLogAddon({log,dateKey,onSaveLog,customLabel,setTasks}){
  const [open,setOpen]=useState(false);const [msgs,setMsgs]=useState(log.messages);const [reply,setReply]=useState("");const [loading,setLoading]=useState(false);const [error,setError]=useState("");const msgsRef=useRef(null);
  useEffect(()=>{if(msgsRef.current)msgsRef.current.scrollTop=msgsRef.current.scrollHeight;},[msgs,loading]);
  const send=async()=>{
    const text=reply.trim();if(!text||loading)return;setReply("");setLoading(true);setError("");
    const hashTasks=extractHashTasks(text);
    if(hashTasks.length&&setTasks)setTasks(prev=>[...prev,...hashTasks.map(title=>({id:uid(),title,priority:"A",projectId:"misc",addedDate:todayDS(),doneDate:null,today:true}))]);
    const userMsg={role:"user",content:text};const updated=[...msgs,userMsg];setMsgs(updated);
    try{const r=await askCoach(updated);const final=[...updated,{role:"assistant",content:r}];setMsgs(final);if(onSaveLog)onSaveLog(dateKey,log.type,final);}
    catch(e){setError(e.message);setMsgs(m=>[...m,{role:"assistant",content:"Sorry, trouble responding. Try again."}]);}
    setLoading(false);
  };
  const typeLabel=customLabel!=null?customLabel:{morning:"🌅 Morning",midday:"☀️ Midday",evening:"🌆 Evening",chat:"💬 Chat"}[log.type]||log.type;
  return(<details style={{marginBottom:8,border:`1px solid ${C.border}`,borderRadius:8,overflow:"hidden"}} open={open} onToggle={e=>setOpen(e.target.open)}>
    <summary style={{padding:"6px 10px",cursor:"pointer",fontSize:".82rem",fontWeight:600,background:C.bg2,userSelect:"none",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <span>{typeLabel}</span><span style={{fontSize:".8rem",color:C.text3}}>{open?"▴":"▾"}</span>
    </summary>
    <div style={{padding:"8px 14px 8px 14px",background:C.bg}}>
      <div ref={msgsRef} style={{display:"flex",flexDirection:"column",gap:6,marginBottom:8,maxHeight:220,overflowY:"auto",padding:"2px 4px 2px 8px"}}>
        {msgs.filter(m=>m.content!=="__pending__").map((m,mi)=>(
          <div key={mi} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",width:"100%"}}><div style={{maxWidth:"88%",padding:"6px 10px",fontSize:".8rem",lineHeight:1.5,wordBreak:"break-word",borderRadius:m.role==="user"?"8px 8px 2px 8px":"8px 8px 8px 2px",background:m.role==="user"?C.accent:C.card,color:m.role==="user"?"#fff":C.text,border:m.role==="user"?"none":`1px solid ${C.border}`,whiteSpace:"pre-wrap"}}>{m.content}</div></div>
        ))}
        {loading&&<div style={{alignSelf:"flex-start",padding:"6px 10px",borderRadius:"8px 8px 8px 2px",background:C.card,border:`1px solid ${C.border}`,fontSize:".8rem",color:C.text3,fontStyle:"italic"}}>Thinking…</div>}
      </div>
      {error&&<div style={{fontSize:".75rem",color:C.pa,marginBottom:6}}>⚠️ {error}</div>}
      <div style={{display:"flex",gap:6}}>
        <textarea style={{...S.input,flex:1,fontSize:".82rem",minHeight:40,maxHeight:100,resize:"none",lineHeight:1.4}} value={reply} onChange={e=>setReply(e.target.value)} placeholder="Continue…" rows={2}/>
        <button style={btn("primary",{fontSize:".8rem",padding:"6px 12px"})} onClick={send} disabled={!reply.trim()||loading}>{loading?"…":"Send"}</button>
      </div>
    </div>
  </details>);
}

function getCheckInType(){const h=new Date().getHours();if(h>=9&&h<12)return"morning";if(h>=12&&h<17)return"midday";if(h>=17&&h<24||h===0)return"evening";return null;}
const CI={
  morning:{emoji:"🌅",label:"Morning",title:"How are you feeling and what kind of day are you planning?",placeholder:"Share how you're feeling — use # to add tasks",bg:C.mo2,border:C.mo,showMood:false,prompt:(r,ctx)=>`Morning check-in. User shared: "${r}". Respond warmly — acknowledge how they're feeling first, then gently engage with their plans. Context: ${ctx}`},
  midday:{emoji:"☀️",label:"Midday",title:"How's your day going so far?",placeholder:"On track? Stuck? Use # to add tasks",bg:C.pg2,border:C.pg,showMood:true,prompt:(r,ctx)=>`Midday check-in. User said: "${r}". Check in on energy and progress. Context: ${ctx}`},
  evening:{emoji:"🌇",label:"Evening",title:"How did your day go?",placeholder:"Reflect on your day — use # to add tasks for tomorrow",bg:C.td2,border:C.td,showMood:true,prompt:(r,ctx)=>`Evening check-in. User said: "${r}". Respond warmly, acknowledge what they accomplished, offer one gentle reflection. Context: ${ctx}`},
};

function CheckInPanel({moodData,actData,tasks,coachLogs,dismissed,onDismiss,onSaveLog,setTasks,moodWords,onSaveMood,onSaveAct,coachMemory,updateCoachMemory}){
  const type=getCheckInType();const todayKey=todayDS();const existingLog=(coachLogs[todayKey]||[]).find(l=>l.type===type);
  const [mood,setMood]=useState(existingLog?.mood||moodData[todayKey]?.mood||"");const [words,setWords]=useState(existingLog?.words||moodData[todayKey]?.words||[]);const [phys,setPhys]=useState(existingLog?.phys||actData[todayKey]?.phys||"");
  const [reply,setReply]=useState("");const [chatHist,setChatHist]=useState(existingLog?(existingLog.messages||[]).filter(m=>m.content!=="__pending__"):[]);const [loading,setLoading]=useState(false);const [error,setError]=useState("");const [started,setStarted]=useState(!!existingLog);const [tasksAdded,setTasksAdded]=useState([]);const msgsRef=useRef(null);
  useEffect(()=>{if(msgsRef.current)msgsRef.current.scrollTop=msgsRef.current.scrollHeight;},[chatHist,loading]);
  if(!type)return null;
  const cfg=CI[type];const isEvening=type==="evening";
  const moodOpts=[{v:"great",em:"😊",lb:"Great"},{v:"good",em:"🙂",lb:"Good"},{v:"okay",em:"😐",lb:"OK"},{v:"hard",em:"😩",lb:"Ugh"}];const actOpts=[{v:"great",em:"💪",lb:"Great"},{v:"okay",em:"🚶",lb:"Okay"},{v:"skip",em:"🛋",lb:"Skipped"}];
  const saveToCalendars=(m,w,p)=>{if(m&&onSaveMood){const ex=moodData[todayKey]||{};onSaveMood(todayKey,{...ex,mood:m,words:w||[]});}if(isEvening&&p&&onSaveAct){const ex=actData[todayKey]||{};onSaveAct(todayKey,{...ex,phys:p});}};
  const buildCtx=()=>{
    // Mood/activity last 5 days
    const recent=[];for(let i=0;i<5;i++){const d=new Date();d.setDate(d.getDate()-i);const k=toDS(d.getFullYear(),d.getMonth(),d.getDate());if(moodData[k]||actData[k])recent.push({date:k,mood:moodData[k]?.mood,phys:actData[k]?.phys});}
    // Active tasks
    const ts=tasks.filter(t=>!t.doneDate).slice(0,12).map(t=>`[${t.priority}${t.today?"★":""}${t.inProgress?"🔄":""}${t.waiting?"⏳":""}] ${t.title}${t.dueDate?" (due:"+t.dueDate+")":""}`);
    // Recent completions last 7 days
    const sevenAgo=new Date();sevenAgo.setDate(sevenAgo.getDate()-7);const sevenAgoDS=toDS(sevenAgo.getFullYear(),sevenAgo.getMonth(),sevenAgo.getDate());
    const done=tasks.filter(t=>t.doneDate&&t.doneDate>=sevenAgoDS).map(t=>`${t.title} (completed:${t.completedOn||t.doneDate}${t.completedTime?" at "+t.completedTime:""})`);
    // Long-term memories
    const mems=coachMemory?.insights?.length>0?"Memories about Maureen:\n"+coachMemory.insights.map((m,i)=>(i+1)+". "+m).join("\n"):"";
    // Recent chat history (last 5 days, excluding today)
    const recentChats=Object.entries(coachLogs||{}).filter(([dk,logs])=>dk!==todayDS()&&dk>=sevenAgoDS&&logs.some(l=>l.messages?.length>0)).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,5).map(([dk,logs])=>{const chatLog=logs.find(l=>l.type==="chat")||logs[0];const msgs=(chatLog?.messages||[]).filter(m=>m.content&&m.content!=="__pending__").slice(-6).map(m=>(m.role==="user"?"Maureen":"Coach")+": "+m.content).join("\n");return msgs?("--- "+dk+" ---\n"+msgs):null;}).filter(Boolean).join("\n\n");
    let ctx="Recent mood/activity: "+JSON.stringify(recent)+".\nActive tasks: "+(ts.join(", ")||"none")+".\nCompleted last 7 days: "+(done.join(", ")||"none")+".";
    if(mems)ctx+="\n\n"+mems;
    if(recentChats)ctx+="\n\nRecent conversations:\n"+recentChats;
    return ctx;};
  const send=async(msg)=>{
    const text=msg||reply.trim();if(!text||loading)return;setReply("");setLoading(true);setError("");setStarted(true);
    saveToCalendars(mood,words,phys);
    storageSet("wh_draft_"+todayDS()+"_"+type,{text,mood,words,phys,savedAt:new Date().toISOString()});
    const hashTasks=extractHashTasks(text);if(hashTasks.length&&setTasks){setTasks(prev=>[...prev,...hashTasks.map(title=>({id:uid(),title,priority:"A",projectId:"misc",addedDate:todayDS(),doneDate:null,today:true}))]);setTasksAdded(hashTasks);setTimeout(()=>setTasksAdded([]),4000);}
    const isFirst=chatHist.length===0;const moodCtx=mood?` Mood: ${mood}.`:"";const actCtx=isEvening&&phys?` Activity: ${phys}.`:"";
    const userMsg={role:"user",content:text};const apiMsg=isFirst?{role:"user",content:cfg.prompt(text+moodCtx+actCtx,buildCtx())}:userMsg;const displayHist=[...chatHist,userMsg];setChatHist(displayHist);
    try{const r=await askCoach(isFirst?[apiMsg]:[...chatHist,userMsg],buildCtx());const updatedHist=[...displayHist,{role:"assistant",content:r}];setChatHist(updatedHist);if(onSaveLog)onSaveLog(todayDS(),type,updatedHist,{mood,words,phys});
      // Memory trigger detection
      const lowerText=text.toLowerCase();const memTrigger=lowerText.includes("save that")||lowerText.includes("save it")||lowerText.includes("remember that")||lowerText.includes("remind me")||lowerText.includes("remember this");
      const forgetTrigger=lowerText.includes("forget that")||lowerText.startsWith("forget ");
      const listTrigger=lowerText.includes("what do you remember")||lowerText.includes("what have you saved");
      if(memTrigger){
        // Ask Coach to extract the key insight
        try{const memPrompt=`The user said "${text}" after this conversation. Extract ONE concise memory to save (max 20 words). Focus on preferences, boundaries, procrastination patterns, decisions, or things they want remembered. If it's just casual conversation not worth saving, respond with just "SKIP". Respond with only the memory text or SKIP.`;
        const memR=await askCoach([{role:"user",content:memPrompt}],buildCtx());
        if(memR&&!memR.includes("SKIP")&&memR.trim().length>5){const newMem=memR.trim();const updated={insights:[...(coachMemory?.insights||[]),newMem],lastUpdated:todayDS()};updateCoachMemory(updated);}}catch(e){}
      } else if(forgetTrigger){
        // Remove last memory
        if(coachMemory?.insights?.length>0){const updated={...coachMemory,insights:coachMemory.insights.slice(0,-1)};updateCoachMemory(updated);}
      }}
    catch(e){const offline=e.message.includes("429")||e.message.includes("Rate limit")||e.message.includes("Network")||e.message.includes("401");if(offline){const ph=[...displayHist,{role:"assistant",content:"__pending__",pendingAt:new Date().toISOString()}];setChatHist(ph);if(onSaveLog)onSaveLog(todayDS(),type,ph,{mood,words,phys});setError("Coach is unavailable — your thoughts are saved.");}else{setError(e.message);setChatHist(h=>[...h,{role:"assistant",content:"Sorry, had trouble responding. Try again."}]);}}
    setLoading(false);
  };
  if(dismissed)return(<div style={{background:`linear-gradient(135deg,${cfg.bg},${C.bg2})`,border:`1.5px solid ${cfg.border}`,borderRadius:14,marginBottom:16,padding:"10px 14px",display:"flex",alignItems:"center",gap:8,cursor:"pointer"}} onClick={onDismiss}><span style={{fontFamily:"Georgia,serif",fontSize:".95rem",fontWeight:600,flex:1}}>{cfg.emoji} {cfg.label} check-in</span><span style={{color:C.text3,fontSize:".85rem"}}>▾ open</span></div>);
  return(<div style={{background:`linear-gradient(135deg,${cfg.bg},${C.bg2})`,border:`1.5px solid ${cfg.border}`,borderRadius:14,marginBottom:16,overflow:"hidden"}}>
    <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",cursor:"pointer"}} onClick={onDismiss}>

      {isEvening&&<div style={{display:"flex",gap:6,marginBottom:8}}>{actOpts.map(o=><button key={o.v} onClick={()=>setPhys(o.v)} style={{flex:1,padding:"4px 2px",borderRadius:8,border:`2px solid ${phys===o.v?"#7a5010":C.border}`,background:phys===o.v?"#fef3e2":"rgba(255,255,255,.7)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}><span style={{fontSize:"1rem"}}>{o.em}</span>{phys===o.v&&<span style={{fontSize:".7rem",color:"#7a5010",fontWeight:600}}>{o.lb}</span>}</button>)}</div>}
      {type==="evening"&&<div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:10}}>{(moodWords||[]).slice(0,8).map(w=><button key={w} onClick={()=>setWords(ws=>ws.includes(w)?ws.filter(x=>x!==w):[...ws,w])} style={{padding:"3px 10px",borderRadius:12,border:`1px solid ${words.includes(w)?C.accent:C.border}`,background:words.includes(w)?C.accent+"22":"rgba(255,255,255,.7)",fontSize:".76rem",cursor:"pointer",color:words.includes(w)?C.accent:C.text2}}>{w}</button>)}</div>}
      {started&&<div ref={msgsRef} style={{maxHeight:200,overflowY:"auto",display:"flex",flexDirection:"column",gap:8,marginBottom:10,padding:"2px 4px 2px 8px"}}>

        {loading&&<div style={{alignSelf:"flex-start",padding:"8px 12px",borderRadius:"10px 10px 10px 2px",background:"rgba(255,255,255,.85)",border:`1px solid ${C.border}`,fontSize:".85rem",color:C.text3,fontStyle:"italic"}}>Thinking…</div>}
      </div>}
      {error&&<div style={{fontSize:".78rem",color:C.pa,marginBottom:6}}>⚠️ {error}</div>}
      {tasksAdded.length>0&&<div style={{fontSize:".78rem",color:"#6b4c0a",background:C.td2,border:"1px solid #D4A820",borderRadius:6,padding:"4px 8px",marginBottom:6}}>🌅 Added to Today: {tasksAdded.join(", ")}</div>}
      <div style={{display:"flex",gap:8}}>
        <textarea style={{...S.input,flex:1,background:"rgba(255,255,255,.7)",minHeight:44,maxHeight:120,resize:"none",lineHeight:1.4}} value={reply} onChange={e=>setReply(e.target.value)} placeholder={started?"Continue…":cfg.placeholder} rows={2}/>
        <button style={btn("primary")} onClick={()=>send()} disabled={!reply.trim()||loading}>{loading?"…":"Send"}</button>
      </div>
    </div>
  </div>);
}

function PendingCatchupBanner({coachLogs,onSaveLog}){
  const [catching,setCatching]=useState(false);const [done,setDone]=useState(false);const [status,setStatus]=useState("");
  const pending=useMemo(()=>{const found=[];Object.entries(coachLogs).forEach(([dk,logs])=>{logs.forEach((log,li)=>{if(log.messages.some(m=>m.content==="__pending__"))found.push({dateKey:dk,logIndex:li,log});});});return found;},[coachLogs]);
  if(!pending.length||done)return null;
  const catchUp=async()=>{setCatching(true);for(const{dateKey,log}of pending){setStatus(`Catching up on your ${log.type} check-in from ${dateKey}…`);const cleanMsgs=log.messages.filter(m=>m.content!=="__pending__");try{const r=await askCoach(cleanMsgs);onSaveLog(dateKey,log.type,[...cleanMsgs,{role:"assistant",content:r}]);}catch(e){setStatus("Still offline — try again later.");setCatching(false);return;}}setStatus("");setCatching(false);setDone(true);};
  return(<div style={{background:"#FEF3C7",border:"1.5px solid #D4A820",borderRadius:12,padding:"12px 14px",marginBottom:16,display:"flex",alignItems:"flex-start",gap:10}}>
    <span style={{fontSize:"1.2rem",flexShrink:0}}>⏳</span>
    <div style={{flex:1}}><div style={{fontWeight:600,fontSize:".88rem",marginBottom:3}}>{pending.length} check-in {pending.length===1?"response":"responses"} waiting</div><div style={{fontSize:".8rem",color:"#6b4c0a"}}>{catching?status:"Your thoughts were saved while Coach was offline. Ready to respond now."}</div></div>
    {!catching&&<button onClick={catchUp} style={{flexShrink:0,padding:"6px 14px",background:"#B8941F",color:"#fff",border:"none",borderRadius:8,fontSize:".82rem",fontWeight:600,cursor:"pointer"}}>Catch up</button>}
    {catching&&<div style={{flexShrink:0,fontSize:".82rem",color:"#6b4c0a",fontStyle:"italic"}}>Working…</div>}
  </div>);
}

const QPS={fitness:"Give me a specific fitness suggestion — one concrete thing I can do this week to improve flexibility, strength, or cardio.",procrastination:"I've been procrastinating. Don't give me tips — ask me ONE thoughtful question to help me understand why.",retired:"I'm retired and sometimes feel like I'm drifting. Help me think about this meaningfully.",moving:"I need to get moving today. Suggest one small, specific physical thing I can do right now.",focus:"Looking at my active tasks, what should I focus on today? Help me pick the most important one or two.",routine:"Help me think about building a daily routine for a retired, project-oriented person who wants structure but not rigidity.",moodact:"What connection do you see between my mood and activity levels based on my data?"};

function CoachTab({moodData,actData,tasks,projects,setTasks,coachMemory,onUpdateMemory,coachLogs,onSaveLog,checkInDismissed,onDismissCheckIn,moodWords,onSaveMood,onSaveAct}){

  useEffect(()=>{const tl=(coachLogs[todayDS()]||[]).find(l=>l.type==="chat");if(tl)setChatHist(tl.messages);setChatLoaded(true);},[]);
  useEffect(()=>{if(chatLoaded&&chatHist.length>0&&onSaveLog)onSaveLog(todayDS(),"chat",chatHist);},[chatHist,chatLoaded]);
  useEffect(()=>{if(msgsRef.current)msgsRef.current.scrollTop=msgsRef.current.scrollHeight;},[chatHist,chatLoading]);
  const buildCtx=useCallback(()=>{const recent=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const k=toDS(d.getFullYear(),d.getMonth(),d.getDate());if(moodData[k]||actData[k])recent.push({date:k,mood:moodData[k]?.mood||null,phys:actData[k]?.phys||null});}const active=tasks.filter(t=>!t.doneDate).slice(0,6).map(t=>`[${t.priority}] ${t.title}`);const compl=tasks.filter(t=>t.doneDate).slice(-4).map(t=>t.title);const memStr=coachMemory.insights.length>0?"\n\nFrom past sessions:\n"+coachMemory.insights.map((m,i)=>`${i+1}. ${m}`).join("\n"):"";return`Recent 7 days: ${JSON.stringify(recent)}. Active: ${active.join(", ")||"none"}. Completed: ${compl.join(", ")||"none"}.${memStr}`;},[moodData,actData,tasks,coachMemory]);
  const loadInsight=async()=>{setInsightLoading(true);setInsight("Thinking…");setInsightError("");setInsightSecs(0);const timer=setInterval(()=>setInsightSecs(s=>s+1),1000);const ht=setTimeout(()=>{clearInterval(timer);setInsightLoading(false);setInsight("");setInsightError("Timed out — tap Refresh again.");},30000);try{const h=new Date().getHours();const tc=h<12?"morning":h<17?"midday":"evening";const txt=await askCoach([{role:"user",content:`It is ${tc}. Give me one brief wellness insight or gentle nudge for the day ahead. Warm, personal, 2 sentences max.`}],buildCtx());if(txt&&txt.length>20){setInsight(txt);storageSet("wh_insight_today",{date:todayDS(),text:txt});}else{setInsight("");setInsightError("Empty response — tap Refresh to try again.");}}catch(e){setInsight("");setInsightError("Error: "+e.message);}clearInterval(timer);clearTimeout(ht);setInsightLoading(false);};
  useEffect(()=>{if(insightLoadedRef.current)return;insightLoadedRef.current=true;storageGet("wh_insight_today",null).then(saved=>{if(saved&&saved.date===todayDS()&&saved.text&&saved.text.length>20)setInsight(saved.text);else setInsight("Tap Refresh for your check-in insight.");});},[]);
  const doPatterns=async()=>{setPatLoading(true);setPatResult("");setError("");try{const txt=await askCoach([{role:"user",content:"Look at my mood and activity data. What patterns do you see? Be specific and personal."}],buildCtx());setPatResult(txt);}catch(e){setError(e.message);}setPatLoading(false);};
  const sendMsg=async(override)=>{const msg=override||input.trim();if(!msg||chatLoading)return;setInput("");setError("");const newHist=[...chatHist,{role:"user",content:msg}];setChatHist(newHist);setChatLoading(true);try{const reply=await askCoach(newHist,buildCtx());const updated=[...newHist,{role:"assistant",content:reply}];setChatHist(updated.length>20?updated.slice(-20):updated);}catch(e){if(e.message.includes("Rate limit")||e.message.includes("429")||e.message.includes("Network"))setError("Coach is offline — try again later.");else setChatHist(h=>[...h,{role:"assistant",content:"Sorry: "+e.message}]);}setChatLoading(false);};
  return(<div>
    <PendingCatchupBanner coachLogs={coachLogs||{}} onSaveLog={onSaveLog||(()=>{})}/>
    {(()=>{const type=getCheckInType();const showCheckin=type&&!checkInDismissed;return(<>
      <div style={{background:"linear-gradient(135deg,#F5EDE0,#EDE3D4)",border:`1px solid ${C.accent2}`,borderRadius:12,marginBottom:showCheckin?0:16,overflow:"hidden",borderBottomLeftRadius:showCheckin?0:12,borderBottomRightRadius:showCheckin?0:12}}>
        <div style={{display:"flex",alignItems:"center",padding:"10px 14px",cursor:"pointer",userSelect:"none"}} onClick={()=>setInsightDismissed(v=>!v)}>
          <span style={{...S.secLbl,marginBottom:0,flex:1}}>Check-in Insight</span>
          <div style={{display:"flex",gap:4,alignItems:"center"}}>
            {!insightDismissed&&<button style={{...btn("ghost"),padding:"3px 8px",fontSize:".78rem"}} onClick={e=>{e.stopPropagation();loadInsight();}} disabled={insightLoading}>{insightLoading?`… (${insightSecs}s)`:"Refresh"}</button>}
            <span style={{color:C.text3,fontSize:".8rem"}}>{insightDismissed?"▾":"▴"}</span>
          </div>
        </div>
        {!insightDismissed&&<div style={{padding:"0 14px 14px"}}>
          {insightError&&<div style={{fontSize:".8rem",color:C.pa,marginBottom:4}}>⚠️ {insightError}</div>}
          {insight&&<div style={{fontFamily:"Georgia,serif",fontSize:".95rem",fontStyle:"italic",lineHeight:1.72,color:C.text}}>{insight}</div>}
        </div>}
      </div>
      {type&&<div style={{marginBottom:16}}><CheckInPanel moodData={moodData} actData={actData} tasks={tasks} coachLogs={coachLogs} dismissed={checkInDismissed} onDismiss={onDismissCheckIn} onSaveLog={onSaveLog} setTasks={setTasks} moodWords={moodWords} onSaveMood={onSaveMood} onSaveAct={onSaveAct} coachMemory={coachMemory} updateCoachMemory={onUpdateMemory}/></div>}
    </>);})()}
    {(coachLogs[todayDS()]||[]).filter(l=>["morning","midday","evening"].includes(l.type)&&l.type!==getCheckInType()&&l.messages?.filter(m=>m.content!=="__pending__").length>0).map((log,i)=>{const cfg2=CI[log.type]||{};return <CoachLogAddon key={i} log={log} dateKey={todayDS()} onSaveLog={onSaveLog} setTasks={setTasks} customLabel={`${cfg2.emoji||""} ${cfg2.label||log.type}`}/>;})}
    {error&&<div style={{background:"#fde8e7",border:`1px solid ${C.pa}`,borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:".83rem",color:C.pa,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}><span>⚠️ {error}</span><button onClick={()=>setError("")} style={{background:"none",border:"none",cursor:"pointer",color:C.pa,fontWeight:700,fontSize:".8rem"}}>▴ dismiss</button></div>}
    {coachMemory.insights.length>0&&<div style={{...S.card,marginBottom:18}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}><div style={{fontFamily:"Georgia,serif",fontSize:"1rem",fontWeight:600}}>🧠 What Coach Remembers</div><button onClick={()=>onUpdateMemory({insights:[],lastUpdated:null})} style={{fontSize:".72rem",color:C.text3,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>Clear all</button></div><ul style={{margin:0,padding:"0 0 0 18px",display:"flex",flexDirection:"column",gap:4}}>{coachMemory.insights.map((ins,i)=><li key={i} style={{fontSize:".83rem",color:C.text2,lineHeight:1.5,display:"flex",alignItems:"flex-start",gap:6,listStyle:"none",paddingLeft:0}}><span style={{color:C.accent,flexShrink:0}}>•</span><span>{ins}</span><button onClick={()=>onUpdateMemory({...coachMemory,insights:coachMemory.insights.filter((_,j)=>j!==i)})} style={{marginLeft:"auto",background:"none",border:"none",cursor:"pointer",color:C.text3,fontSize:".75rem",flexShrink:0}}>✕</button></li>)}</ul><div style={{marginTop:8,fontSize:".72rem",color:C.text3}}>Last updated: {coachMemory.lastUpdated?new Date(coachMemory.lastUpdated).toLocaleDateString():"—"}</div></div>}
    <div style={S.card}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:chatCollapsed?0:12,cursor:"pointer"}} onClick={()=>setChatCollapsed(v=>!v)}>
        <div style={{fontFamily:"Georgia,serif",fontSize:"1rem",fontWeight:600}}>💬 Ask Coach anything</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}} onClick={e=>e.stopPropagation()}>
          {!chatCollapsed&&<button onClick={doPatterns} disabled={patLoading} style={{...btn("ghost"),padding:"3px 10px",fontSize:".76rem"}}>{patLoading?"…":"📊 Patterns"}</button>}
          {!chatCollapsed&&chatHist.length>0&&<button onClick={()=>{setChatHist([]);if(onSaveLog)onSaveLog(todayDS(),"chat",[]);}} style={{fontSize:".72rem",color:C.text3,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>Clear</button>}
          <span style={{color:C.text3,fontSize:".8rem"}}>{chatCollapsed?"▾":"▴"}</span>
        </div>
      </div>
      {!chatCollapsed&&<div>
        {Object.entries(coachLogs||{}).filter(([dk,logs])=>dk!==todayDS()&&logs.some(l=>l.type==="chat")).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7).map(([dk,logs])=>{const cl=logs.find(l=>l.type==="chat");if(!cl)return null;const parts=dk.split("-");return <CoachLogAddon key={dk} log={cl} dateKey={dk} onSaveLog={onSaveLog} customLabel={`💬 ${MONTHS[parseInt(parts[1])-1]} ${parseInt(parts[2])}`}/>;})}
        <span style={S.secLbl}>Quick Prompts</span>

        <div ref={msgsRef} style={{minHeight:180,maxHeight:400,overflowY:"auto",border:`1px solid ${C.border}`,borderRadius:8,background:C.bg,padding:"12px 14px 12px 20px",marginBottom:10,display:"flex",flexDirection:"column",gap:8}}>
          {chatHist.length===0&&<div style={{alignSelf:"flex-start",maxWidth:"86%",padding:"9px 13px",borderRadius:"10px 10px 10px 2px",background:C.card,border:`1px solid ${C.border}`,fontSize:".85rem",lineHeight:1.52}}>Hi! I'm your wellness coach. Use a quick prompt above, or ask me anything.</div>}

          {chatLoading&&<div style={{alignSelf:"flex-start",padding:"9px 13px",borderRadius:"10px 10px 10px 2px",background:C.card,border:`1px solid ${C.border}`,fontSize:".85rem",color:C.text3,fontStyle:"italic"}}>Thinking…</div>}

function ExportModal({moodData,actData,tasks,projects,moodWords,actWords,coachLogs,onClose,onImport}){
  const exportStr=JSON.stringify({exportDate:new Date().toISOString(),moodData,actData,tasks,projects,moodWords,actWords,coachLogs},null,2);
  const importRef=useRef();
  const [pasteVal,setPasteVal]=React.useState("");
  const [showPaste,setShowPaste]=React.useState(false);
  const handlePasteImport=()=>{try{const d=JSON.parse(pasteVal);onImport(d);onClose();alert("✅ Data imported!");}catch{alert("❌ Could not read that JSON. Make sure you copied the full export text.");}};
  const handleImport=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const d=JSON.parse(ev.target.result);onImport(d);onClose();alert("✅ Data imported!");}catch{alert("❌ Could not read that file.");}};reader.readAsText(file);e.target.value="";};
  return(<div style={S.overlay} onClick={onClose}><div style={{...S.modal,maxWidth:500}} onClick={e=>e.stopPropagation()}>

    <textarea id="export-json-ta" style={{...S.textarea,fontFamily:"monospace",fontSize:".72rem",minHeight:240,background:C.bg2}} readOnly value={exportStr} onFocus={e=>{e.target.select();}}/>
    <div style={{fontSize:".75rem",color:C.text3,marginTop:4,textAlign:"center",marginBottom:12}}>Tap in the box above to select all, then copy</div>
    <input ref={importRef} type="file" accept=".json" style={{display:"none"}} onChange={handleImport}/>
    <div style={{display:"flex",justifyContent:"space-between",gap:8,paddingTop:12,borderTop:`1px solid ${C.border}`}}>
      <button style={btn("ghost")} onClick={()=>importRef.current.click()}>📂 Import from file</button><button style={btn("ghost")} onClick={()=>setShowPaste(p=>!p)}>📋 Paste JSON</button>{showPaste&&<div style={{marginTop:8,padding:8,background:C.bg2,borderRadius:8}}><textarea style={{...S.textarea,fontFamily:"monospace",fontSize:".72rem",minHeight:80,background:C.bg}} placeholder="Paste your JSON backup here..." value={pasteVal} onChange={e=>setPasteVal(e.target.value)}/><button style={{...btn("primary"),marginTop:6,width:"100%"}} onClick={handlePasteImport}>✅ Import Pasted JSON</button></div>}
      <div style={{display:"flex",gap:8}}>
        <button style={btn("ghost")} onClick={()=>{const today=new Date();const mm=String(today.getMonth()+1).padStart(2,"0");const dd=String(today.getDate()).padStart(2,"0");const fname=`Mizmo Go! ${mm}-${dd}.json`;const blob=new Blob([exportStr],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=fname;a.click();URL.revokeObjectURL(url);}}>⬇️ Download Backup</button><button style={btn("primary")} onClick={()=>{const ta=document.getElementById("export-json-ta");if(ta){ta.select();ta.setSelectionRange(0,99999);}try{document.execCommand("copy");alert("Copied!");}catch(e){alert("Tap in the text box, then Select All and Copy.");}}}>Select All & Copy</button>
        <button style={btn("ghost")} onClick={onClose}>Close</button>
      </div>
    </div>
  </div></div>);
}

function App(){
  useEffect(()=>{const style=document.createElement("style");style.innerHTML=`*{box-sizing:border-box!important;}body,html{margin:0!important;padding:0!important;}`;document.head.appendChild(style);return()=>document.head.removeChild(style);},[]);
  const [tab,setTab]=useState("coach");const [loaded,setLoaded]=useState(false);const [showExport,setShowExport]=useState(false);
  const [moodData,setMoodData]=useState({});const [actData,setActData]=useState({});const [projects,setProjects]=useState([]);const [tasks,setTasks]=useState([]);const [moodWords,setMoodWords]=useState([]);const [actWords,setActWords]=useState([]);const [coachLogs,setCoachLogs]=useState({});const [coachMemory,setCoachMemory]=useState({insights:[],lastUpdated:null});
  const [moodModal,setMoodModal]=useState(null);const [wordModal,setWordModal]=useState(null);const [checkInDismissed,setCheckInDismissed]=useState(false);const [showSettings,setShowSettings]=useState(false);

  useEffect(()=>{(async()=>{
    const seeded=await storageGet(STORE_KEYS.seeded,false);
    if(!seeded){setMoodData(SEED.moodData);setActData(SEED.actData);setTasks(SEED.tasks);setProjects(SEED.projects);setMoodWords(SEED.moodWords);setActWords(SEED.actWords);setCoachLogs(SEED.coachLogs||{});await storageSet(STORE_KEYS.mood,SEED.moodData);await storageSet(STORE_KEYS.act,SEED.actData);await storageSet(STORE_KEYS.tasks,SEED.tasks);await storageSet(STORE_KEYS.projects,SEED.projects);await storageSet(STORE_KEYS.moodWords,SEED.moodWords);await storageSet(STORE_KEYS.actWords,SEED.actWords);await storageSet(STORE_KEYS.coachLogs,SEED.coachLogs||{});await storageSet(STORE_KEYS.seeded,true);}
    else{const[mood,act,t,p,mw,aw,cl,mem]=await Promise.all([storageGet(STORE_KEYS.mood,SEED.moodData),storageGet(STORE_KEYS.act,SEED.actData),storageGet(STORE_KEYS.tasks,SEED.tasks),storageGet(STORE_KEYS.projects,SEED.projects),storageGet(STORE_KEYS.moodWords,SEED.moodWords),storageGet(STORE_KEYS.actWords,SEED.actWords),storageGet(STORE_KEYS.coachLogs,{}),loadCoachMemory()]);setMoodData(mood);setActData(act);setTasks(t);setProjects(p);setMoodWords(mw);setActWords(aw);setCoachLogs(cl);setCoachMemory(mem);}
    const h=new Date().getHours();setTab(((h>=9&&h<12)||(h>=12&&h<15)||(h>=17&&h<21))?"coach":"todo");setLoaded(true);
  })();},[]);

  useEffect(()=>{if(!loaded)return;const today=todayDS();const threeDays=new Date();threeDays.setDate(threeDays.getDate()+3);const threeDaysStr=toDS(threeDays.getFullYear(),threeDays.getMonth(),threeDays.getDate());setTasks(prev=>{let changed=false;const updated=prev.map(t=>{// Auto-manage recurring task availability
if(t.recur&&!t.doneDate){if(t.dueDate&&t.dueDate<=threeDaysStr&&t.priority!=="A"){changed=true;return{...t,priority:"A"};}if((!t.dueDate||t.dueDate>threeDaysStr)&&t.priority!=="B"){changed=true;return{...t,priority:"B"};}}return t;});const updated2=updated.map(t=>{if(t.dueDate===today&&!t.today&&!t.doneDate){changed=true;return{...t,today:true};}if(t.inProgress&&!t.doneDate&&!t.today&&t.progressedOn===today){changed=true;return{...t,today:true};}if(t.completedOn&&t.completedOn!==today){changed=true;return{...t,today:undefined,completedOn:undefined,progressedOn:undefined};}// Waiting tasks due within 3 days resurface on On Deck
if(t.waiting&&!t.doneDate&&t.dueDate&&t.dueDate<=threeDaysStr&&!t.onDeck){changed=true;return{...t,onDeck:true};}return t;});return changed?updated2:prev;});},[loaded]);

  useEffect(()=>{if(loaded)storageSet(STORE_KEYS.mood,moodData);},[moodData,loaded]);
  useEffect(()=>{if(loaded)storageSet(STORE_KEYS.act,actData);},[actData,loaded]);
  useEffect(()=>{if(loaded)storageSet(STORE_KEYS.tasks,tasks);},[tasks,loaded]);
  useEffect(()=>{if(loaded)storageSet(STORE_KEYS.projects,projects);},[projects,loaded]);
  useEffect(()=>{if(loaded)storageSet(STORE_KEYS.moodWords,moodWords);},[moodWords,loaded]);
  useEffect(()=>{if(loaded)storageSet(STORE_KEYS.actWords,actWords);},[actWords,loaded]);
  useEffect(()=>{if(loaded)storageSet(STORE_KEYS.coachLogs,coachLogs);},[coachLogs,loaded]);

  const handleUpdateMemory=mem=>{setCoachMemory(mem);saveCoachMemory(mem);};
  const saveCoachLog=(dateKey,type,messages,meta={})=>{setCoachLogs(prev=>{const existing=prev[dateKey]||[];const filtered=existing.filter(l=>l.type!==type);return{...prev,[dateKey]:[...filtered,{type,messages,savedAt:new Date().toISOString(),...meta}]};});if(meta.mood&&type!=="chat"){setMoodData(prev=>{const e=prev[dateKey]||{};return{...prev,[dateKey]:{...e,mood:meta.mood,words:meta.words||[]}}});}if(meta.phys&&type==="evening"){setActData(prev=>{const e=prev[dateKey]||{};return{...prev,[dateKey]:{...e,phys:meta.phys}}});}};
  const handleImport=d=>{if(d.tasks)setTasks(d.tasks);if(d.projects)setProjects(d.projects);if(d.moodData)setMoodData(d.moodData);if(d.actData)setActData(d.actData);if(d.moodWords)setMoodWords(d.moodWords);if(d.actWords)setActWords(d.actWords);if(d.coachLogs)setCoachLogs(d.coachLogs);};
  const saveMood=(key,data)=>{setMoodData(m=>({...m,[key]:data}));setMoodModal(null);};
  const handleAddWord=(target,words,setWords)=>setWordModal({target,words,setWords});
  const saveWord=word=>{const{target,words,setWords}=wordModal;if(target==="mood")setMoodWords(w=>w.includes(word)?w:[...w,word]);else setActWords(w=>w.includes(word)?w:[...w,word]);if(!words.includes(word))setWords([...words,word]);setWordModal(null);};

  const streak=useMemo(()=>{let s=0;const d=new Date();const tk=toDS(d.getFullYear(),d.getMonth(),d.getDate());if(!moodData[tk]&&!actData[tk])d.setDate(d.getDate()-1);for(let i=0;i<365;i++){const k=toDS(d.getFullYear(),d.getMonth(),d.getDate());if(moodData[k]||actData[k]){s++;d.setDate(d.getDate()-1);}else break;}return s;},[moodData,actData]);

  const TABS=[["coach","💬 Coach"],["todo","✅ Today"],["mood","📅 Calendar"],["completed","📋 Done"]];

  if(!loaded)return(<div style={{...S.app,display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}><div style={{textAlign:"center",color:C.text3}}><div style={{fontSize:"2rem",marginBottom:10}}>🌿</div><div style={{fontFamily:"Georgia,serif",fontSize:"1rem"}}>Loading Mizmo Go!…</div></div></div>);

  return(<div style={S.app}>
    <header style={S.hdr}>
      <div style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",fontWeight:700,color:C.accent}}>Mizmo <em style={{color:C.text,fontWeight:400}}>Go!</em></div>
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:4,background:C.bg2,border:`1px solid ${C.border}`,borderRadius:20,padding:"3px 10px",fontSize:".75rem",fontWeight:600,color:C.accent}}>🔥 {streak} day streak</div>
        <button onClick={()=>setShowSettings(true)} style={{...S.btnIcon,fontSize:".72rem",padding:"3px 8px",width:"auto",color:C.text3}} title="Settings">⚙️</button><button onClick={()=>setShowExport(true)} style={{...S.btnIcon,fontSize:".72rem",padding:"3px 8px",width:"auto",color:C.text3}} title="Export / Import">⬇️</button>
      </div>
    </header>
    <nav style={S.tabbar}>{TABS.map(([id,label])=><button key={id} style={{flexShrink:0,padding:"6px 6px",background:"none",border:"none",borderBottom:tab===id?`3px solid ${C.accent}`:"3px solid transparent",fontSize:".74rem",fontWeight:tab===id?600:500,color:tab===id?C.accent:C.text2,cursor:"pointer",whiteSpace:"nowrap",transition:"all .18s"}} onClick={()=>setTab(id)}>{label}</button>)}</nav>
    <div style={S.panel}>
      {tab==="mood"&&<div style={S.card}><MoodCalendar moodData={moodData} tasks={tasks} coachLogs={coachLogs} onDayClick={setMoodModal}/></div>}
      {tab==="todo"&&<TodoTab tasks={tasks} projects={projects} setTasks={setTasks} setProjects={setProjects}/>}
      {tab==="completed"&&<CompletedTab tasks={tasks} projects={projects} setTasks={setTasks}/>}
      {tab==="coach"&&<CoachTab moodData={moodData} actData={actData} tasks={tasks} projects={projects} setTasks={setTasks} coachMemory={coachMemory} onUpdateMemory={handleUpdateMemory} coachLogs={coachLogs} onSaveLog={saveCoachLog} checkInDismissed={checkInDismissed} onDismissCheckIn={()=>setCheckInDismissed(v=>!v)} moodWords={moodWords} onSaveMood={saveMood} onSaveAct={(key,data)=>setActData(a=>({...a,[key]:data}))}/>}
    </div>
    {moodModal&&<MoodModal dateKey={moodModal} moodData={moodData} moodWords={moodWords} tasks={tasks} coachLogs={coachLogs} onSave={saveMood} onClose={()=>setMoodModal(null)} onAddWord={handleAddWord} onSaveLog={saveCoachLog} setTasks={setTasks} onReopenTask={id=>setTasks(prev=>prev.map(t=>t.id===id?{...t,doneDate:null}:t))}/>}
    {wordModal&&<WordModal onSave={saveWord} onClose={()=>setWordModal(null)}/>}
    {showSettings&&<SettingsModal onClose={()=>setShowSettings(false)}/> }{showExport&&<ExportModal moodData={moodData} actData={actData} tasks={tasks} projects={projects} moodWords={moodWords} actWords={actWords} coachLogs={coachLogs} onClose={()=>setShowExport(false)} onImport={handleImport}/>}
  </div>);
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));

  </script>
</body>
</html>
